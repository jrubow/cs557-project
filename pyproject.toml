[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs557-combat-rl"
version = "0.1.0"
description = "Controlled Minecraft combat experiments with CraftGround and PPO"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "gymnasium==1.2.2"]

[project.optional-dependencies]
train = ["craftground==2.7.4", "craftground-runtime-mc121==0.1.0", "stable-baselines3==2.7.1", "torch>=2.3,<3", "matplotlib>=3.8,<4"]
human = ["pygame>=2.5,<3"]
video = ["imageio-ffmpeg==0.8.1", "Pillow>=10.1,<13"]

[tool.setuptools.packages.find]
include = ["combat_rl*"]
